# Checked in on purpose: neither target carries a secret. MotherDuck reads MOTHERDUCK_TOKEN
# from the environment, and the local target is just a file path.
# One project, two targets -- switching destination is one environment variable and zero
# model changes.
kbo:
  target: "{{ env_var('DESTINATION', 'duckdb') }}"
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../kbo.duckdb') }}"
      schema: main
      threads: 4
    motherduck:
      type: duckdb
      path: "md:{{ env_var('MOTHERDUCK_DATABASE', 'kbo') }}"
      schema: main
      threads: 4
