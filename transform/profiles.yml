# Checked in on purpose: this profile carries no secret at all -- it is a local file path.
# One project, one target. dbt always builds against the local DuckDB file; the marts are
# copied to MotherDuck afterwards by `kbo publish`, so no model ever knows or cares where
# the published copy lives. Switching to MotherDuck stays one environment variable
# (DESTINATION) and zero model changes.
kbo:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../kbo.duckdb') }}"
      schema: main
      threads: 4
